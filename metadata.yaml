name: astrbot_plugin_buckshot_mneme
display_name: 恶魔轮盘赌 · 内聚记忆
short_desc: 在 QQ 里和 AI 玩《恶魔轮盘赌》：网页实时操作，恶魔用 mneme 记忆学习你的博弈习惯。
desc: >-
  通过 AstrBot + NapCat 在 QQ 里启动《恶魔轮盘赌》。插件会启动本地 Web 控制器，
  把实时画面和操作面板发到网页；玩家在网页开枪、用道具，恶魔由人格 LLM 接管，
  用一次调用同时决定操作和嘲讽台词，并主动推送到 QQ。内置 SQLite FTS5 记忆核，
  自动维护本局算牌便条、跨局玩家画像和博弈法则；支持通过自然语言让 AI 开/关记忆、
  自己练习变强，默认 mock 模式无需 Godot 即可完整测试。
help: 直接说想玩/重开即可；也可用 /恶魔轮盘赌。可以自然地让 AI“自己多练练”或“别用记忆，正常打”。
version: 0.1.2
